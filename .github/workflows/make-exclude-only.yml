name: Make exclude-only

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  simplify:
    if: "!contains(github.event.head_commit.message, '[exclude-only]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove non-exclude modes
        shell: python
        run: |
          from pathlib import Path
          import re

          cpp = Path('src/audio-capture.cpp')
          text = cpp.read_text(encoding='utf-8')

          # The plugin is permanently an exclude-mode source.
          text = text.replace(
              '.mode = (mode)obs_data_get_int(settings, SETTING_MODE),\n\t\t.exclude = obs_data_get_bool(settings, SETTING_EXCLUDE),',
              '.mode = MODE_SESSION,\n\t\t.exclude = true,')

          # Remove the hotkey-only worker path.
          text = re.sub(
              r'\n\tif \(config\.mode == MODE_HOTKEY\) \{.*?\n\t\}\n\n\tauto \*monitor = SessionMonitor::Instance\(\);',
              '\n\tauto *monitor = SessionMonitor::Instance();',
              text, count=1, flags=re.S)

          # Remove mode-selection callback.
          text = re.sub(
              r'static bool mode_callback\(.*?\n\}\n\nstd::tuple<std::string, std::string>',
              'std::tuple<std::string, std::string>',
              text, count=1, flags=re.S)

          # Remove hotkey callbacks and runtime methods.
          text = re.sub(
              r'\nvoid AudioCapture::HotkeyStart\(\).*?\n\nAudioCapture::AudioCapture\(',
              '\nAudioCapture::AudioCapture(',
              text, count=1, flags=re.S)

          # Remove hotkey registration.
          text = re.sub(
              r'\n\thotkey_pair = obs_hotkey_pair_register_source\(.*?\n\t\t\t\t\t\t\t      hotkey_stop, this, this\);',
              '', text, count=1, flags=re.S)

          # The hotkey pair no longer exists, so do not unregister it.
          text = text.replace('\n\tobs_hotkey_pair_unregister(hotkey_pair);\n', '\n')

          # Remove mode UI; leave only the executable exclusion list, active
          # session picker, and latency control.
          text = re.sub(
              r'\n\t// Mode setting \(specific session or hotkey\).*?\n\tobs_property_set_modified_callback\(mode, mode_callback\);\n',
              '\n', text, count=1, flags=re.S)

          # Exclude mode is implicit now; remove its checkbox.
          text = text.replace('\n\t// Exclude setting\n\tobs_properties_add_bool(ps, SETTING_EXCLUDE, TEXT_EXCLUDE);\n', '\n')

          # No mode setting is needed to decide whether unmatched patterns are
          # shown: the source is always a session/executable exclusion source.
          text = re.sub(
              r'\n\tif \(obs_data_get_int\(settings, SETTING_MODE\) != MODE_SESSION\) \{\n\t\tobs_data_release\(settings\);\n\t\treturn;\n\t\}\n',
              '\n', text, count=1)

          # Keep defaults compatible with old OBS source settings, but make
          # exclude explicit for newly-created sources.
          text = text.replace('obs_data_set_default_bool(settings, SETTING_EXCLUDE, false);',
                              'obs_data_set_default_bool(settings, SETTING_EXCLUDE, true);')

          cpp.write_text(text, encoding='utf-8')

          hpp = Path('src/audio-capture.hpp')
          h = hpp.read_text(encoding='utf-8')

          # Remove hotkey-only declarations/constants and leave a single mode.
          h = re.sub(r'\n#define TEXT_MODE_HOTKEY.*?\n', '\n', h)
          h = re.sub(r'\n#define TEXT_HOTKEY_START.*?\n#define HOTKEY_START.*?\n#define HOTKEY_STOP.*?\n', '\n', h)
          h = h.replace('enum mode { MODE_SESSION, MODE_HOTKEY };', 'enum mode { MODE_SESSION };')
          h = h.replace('\n\tHWND hotkey_window = NULL;\n', '\n')
          h = re.sub(r'\n\tvoid IsUwpWindow\(.*?\n\tHWND GetUwpActualWindow\(.*?\n\n\tvoid HotkeyStart\(\);\n\tvoid HotkeyStop\(\);', '', h, flags=re.S)
          hpp.write_text(h, encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          r = re.sub(r'(?s).*', '''# win-exclude-audio\n\nOBS Studio plugin for **exclude-only application audio capture on Windows**.\n\nIt captures the system's Windows audio through process-loopback capture while excluding the executable names you add to the list. No virtual audio cable or external mixer is required.\n\n## Usage\n\n1. Add **Application Audio Output Capture** in OBS.\n2. Add the `.exe` names you want excluded. Wildcards such as `Discord*.exe` are supported.\n3. Disable OBS's built-in **Desktop Audio** source so the audio is not captured twice.\n\nThe source is intentionally exclude-only: there is no include mode or hotkey capture mode.\n\n## Requirements\n\n- OBS Studio 28 or later\n- Windows 10 2004 or later / Windows 11\n\n## Credits\n\nBased on Ayrton09's modernized `win-capture-audio` fork and the original work by bozbez.\n\nGPLv2.\n''', r)
          readme.write_text(r, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audio-capture.cpp src/audio-capture.hpp README.md
          git diff --cached --quiet && exit 0
          git commit -m "Make plugin exclude-only [exclude-only]"
          git push
