name: Build

on:
  push:
    branches: [main]
    tags: ['*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
  workflow_dispatch:

env:
  OBS_VERSION: 28.0.0

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download OBS Studio ${{ env.OBS_VERSION }} (for headers + obs.dll)
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/obsproject/obs-studio/releases/tags/$env:OBS_VERSION"
          $asset = $release.assets | Where-Object { $_.name -match '(Windows(-x64)?|Full-x64)\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "No Windows zip asset on obs-studio $env:OBS_VERSION" }
          Invoke-WebRequest $asset.browser_download_url -OutFile obs.zip
          Expand-Archive obs.zip -DestinationPath obs-dist
          $dll = Get-ChildItem obs-dist -Recurse -Filter obs.dll | Where-Object { $_.FullName -match '64bit' } | Select-Object -First 1
          if (-not $dll) { throw "obs.dll not found in the OBS zip" }
          $obsRoot = $dll.Directory.Parent.Parent.FullName
          "OBS_DIR=$obsRoot" | Out-File $env:GITHUB_ENV -Append

      - name: Configure
        run: cmake -S . -B build -A x64 -DOBS_INSTALL_DIR="${{ env.OBS_DIR }}" -DOBS_VERSION="${{ env.OBS_VERSION }}"

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Package (portable zip + setup installer)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          $m = Select-String CMakeLists.txt -Pattern 'project\(win-capture-audio VERSION ([0-9.]+)'
          if (-not $m) { throw "Could not read the project version from CMakeLists.txt" }
          $version = $m.Matches[0].Groups[1].Value

          # Keep the plugin's internal/DLL name as win-capture-audio for OBS
          # compatibility, but publish this fork under its own product name.
          New-Item -ItemType Directory -Force stage/win-capture-audio | Out-Null
          Copy-Item build/release/* stage/win-capture-audio -Recurse
          Compress-Archive stage/win-capture-audio "dist/win-exclude-audio-$version.zip"

          # Build the real Inno Setup executable, then give the release asset
          # the fork's product name. The installer itself remains a genuine
          # installer generated from installer/installer.iss.in.
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Odist build\installer.generated.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

          $builtInstaller = Get-ChildItem dist -Filter "win-capture-audio-$version-setup.exe" -File | Select-Object -First 1
          if (-not $builtInstaller) { throw "Inno Setup did not produce the expected installer" }
          Move-Item $builtInstaller.FullName "dist/win-exclude-audio-$version-setup.exe"

          Copy-Item build/RelWithDebInfo/win-capture-audio.pdb dist/ -ErrorAction SilentlyContinue

          # Hash only the release payload. SHA256SUMS.txt itself is not hashed.
          $lines = Get-ChildItem dist -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" }
          Set-Content dist/SHA256SUMS.txt -Value $lines -Encoding ascii
          Get-ChildItem dist -File | Select-Object Name, Length
          Get-Content dist/SHA256SUMS.txt

      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: win-exclude-audio-${{ github.sha }}
          path: dist/

  sign:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_ENABLED == 'true'
    runs-on: windows-latest
    steps:
      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: win-capture-audio
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-exclude-audio-signed
          path: signed/

  release:
    needs: [build, sign]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download signed artifact
        if: needs.sign.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: win-exclude-audio-signed
          path: dist

      - name: Download unsigned artifact
        if: needs.sign.result != 'success'
        uses: actions/download-artifact@v4
        with:
          name: win-exclude-audio-${{ github.sha }}
          path: dist

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: win-exclude-audio ${{ github.ref_name }}
          files: dist/**
          body: |
            ## win-exclude-audio ${{ github.ref_name }}

            Exclude-only OBS application audio capture.

            **Install:** run `win-exclude-audio-${{ github.ref_name }}-setup.exe`, or extract `win-exclude-audio-${{ github.ref_name }}.zip` into `%ProgramData%\obs-studio\plugins\` for a portable install.

            SHA-256 checksums are attached as `SHA256SUMS.txt`.
            ${{ needs.sign.result != 'success' && '
            > **These binaries are not code-signed yet.** Windows SmartScreen may warn you when running the installer. You can verify the download against `SHA256SUMS.txt`.' || '' }}
